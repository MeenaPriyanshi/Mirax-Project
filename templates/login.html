<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IITK Athletics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round">
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </div>
        </label>
    </div>

    <div class="center-wrapper">
        <div class="login-container">
            <div class="login-panel">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Please log in to your account</p>
                </div>

                <div class="role-selector">
                    <input type="radio" id="role-member" name="role" value="member" checked>
                    <label for="role-member" class="role-label">Member</label>

                    <input type="radio" id="role-manager" name="role" value="manager">
                    <label for="role-manager" class="role-label">Birthday Manager</label>
                    <div class="role-selector-bg"></div>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="username" placeholder="Enter your username" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <i class="fas fa-eye toggle-password" id="toggle-pwd"></i>
                        </div>
                    </div>

                    <div class="form-actions center-btn">
                        <button type="submit" class="login-btn" id="submitBtn">Login</button>
                    </div>
                </form>

                <div class="login-footer" id="footer-links">
                    <a href="/forgot-password" class="footer-link">Forgot password?</a>
                    <span class="dot-separator" id="footer-dot">•</span>
                    <a href="/register" class="footer-link" id="register-link">Create account</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Logic
            const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (currentTheme === 'dark') toggleSwitch.checked = true;

            toggleSwitch.addEventListener('change', (e) => {
                const newTheme = e.target.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });

            // Password Visibility Toggle
            document.querySelector('#toggle-pwd').addEventListener('click', function () {
                const pwdInput = document.querySelector('#password');
                pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            // Role Toggle UI Logic (Hide 'Create Account' for Managers)
            const roleRadios = document.querySelectorAll('input[name="role"]');
            const registerLink = document.getElementById('register-link');
            const footerDot = document.getElementById('footer-dot');

            roleRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if(e.target.value === 'manager') {
                        registerLink.style.display = 'none';
                        footerDot.style.display = 'none';
                    } else {
                        registerLink.style.display = 'inline';
                        footerDot.style.display = 'inline';
                    }
                });
            });

            // Form Submission API Call
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const btn = document.getElementById('submitBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
                btn.style.pointerEvents = 'none';

                const selectedRole = document.querySelector('input[name="role"]:checked').value;

                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username: document.getElementById('username').value,
                            password: document.getElementById('password').value
                        })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        // Gatekeeping: Check if they used the correct tab
                        if (data.role !== selectedRole) {
                            alert(`Access Denied: This account belongs to a ${data.role}. Please select the ${data.role} tab.`);
                            btn.innerHTML = originalText;
                            btn.style.pointerEvents = 'auto';
                            return;
                        }

                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', data.username);
                        window.location.href = data.role === 'manager' ? '/manager/dashboard' : '/member/dashboard';
                    } else {
                        alert(data.message);
                        btn.innerHTML = originalText;
                        btn.style.pointerEvents = 'auto';
                    }
                } catch (error) {
                    alert('Error connecting to server.');
                    btn.innerHTML = originalText;
                    btn.style.pointerEvents = 'auto';
                }
            });
        });
    </script>
</body>
</html>
