<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - IITK Athletics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round">
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </div>
        </label>
    </div>

    <div class="dashboard">
        <div class="sidebar">
            <h2>Manager</h2>
            <p id="userDisplay" style="color: var(--text-muted); font-weight: 600; margin-bottom: 1.5rem;"></p>
            <hr style="border: 0; border-top: 1px solid var(--input-border); margin-bottom: 1rem;">
            <ul>
                <li onclick="loadView('all')"><i class="fas fa-birthday-cake" style="margin-right: 10px;"></i> View Birthdays</li>
                <li onclick="loadView('add')"><i class="fas fa-user-plus" style="margin-right: 10px;"></i> Add Birthdays</li>
                <li onclick="loadView('pending')"><i class="fas fa-clock" style="margin-right: 10px;"></i> Pending Birthdays</li>
                <li onclick="loadView('messages')"><i class="fas fa-envelope" style="margin-right: 10px;"></i> View Messages</li>
                <li onclick="logout()" style="color: var(--accent); margin-top: 3rem;"><i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Logout</li>
            </ul>
        </div>

        <div class="content" id="mainContent">
            <div class="card">
                <h2>Welcome back!</h2>
                <p style="color: var(--text-muted)">Select an operation from the sidebar navigation menu to get started.</p>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';
        document.getElementById('userDisplay').innerText = '@' + localStorage.getItem('username');

        // Theme sync
        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        if (localStorage.getItem('theme') === 'dark') toggleSwitch.checked = true;
        toggleSwitch.addEventListener('change', (e) => {
            const next = e.target.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        async function loadView(view) {
            const content = document.getElementById('mainContent');
            content.innerHTML = '<div class="card"><h3><i class="fas fa-spinner fa-spin"></i> Fetching data portal...</h3></div>';

            if (view === 'all') {
                const res = await fetch('/api/manager/birthdays', { headers: {'Authorization': `Bearer ${token}`} });
                const data = await res.json();
                let html = `
                    <div class="card">
                        <h2>All Team Birthdays</h2>
                        <div class="input-wrapper" style="margin: 1rem 0;">
                            <i class="fas fa-search input-icon"></i>
                            <input type="text" id="searchBar" placeholder="Filter roster profiles by name or batch labels..." onkeyup="filterTable()">
                        </div>
                        <table id="bdayTable">
                            <tr><th>Name</th><th>Batch</th><th>Birthday Entry</th><th>Action</th></tr>
                `;
                data.forEach(b => {
                    const cleanDate = new Date(b.dob).toLocaleDateString('en-US', { day: 'numeric', month: 'long' });
                    html += `<tr><td><strong>${b.Name}</strong></td><td><span style="color:var(--primary);">${b.Batch}</span></td><td>${cleanDate}</td>
                             <td><button onclick="deleteBday(${b.Sl_no})" style="padding: 6px 12px; font-size:13px; background:var(--accent);"><i class="fas fa-trash"></i></button></td></tr>`;
                });
                content.innerHTML = html + '</table></div>';
            }

            else if (view === 'add') {
                content.innerHTML = `
                    <div class="card">
                        <h2>Add Single Birthday Record</h2>
                        <div class="login-form" style="gap:1rem;">
                            <input type="text" id="bName" placeholder="Full Name">
                            <input type="text" id="bBatch" placeholder="Batch (e.g., Y21)">
                            <input type="date" id="bDob">
                            <button onclick="addManual()" class="login-btn" style="width:100%;">Save Team Member</button>
                        </div>
                    </div>
                    <div class="card" style="margin-top:2rem;">
                        <h2>Batch Import via CSV Sheet</h2>
                        <p style="color:var(--text-muted); margin-bottom:1.5rem; font-size:14px;">
                            <i class="fas fa-info-circle"></i> Accepts flexible headers containing keywords like 'Name', 'Batch', and 'DOB'. Assumes text dates like '3 January'.
                        </p>
                        <div class="input-wrapper" style="margin-bottom:1.5rem;">
                            <input type="file" id="csvFile" accept=".csv" style="padding:10px;">
                        </div>
                        <button onclick="uploadCSV()" id="uploadBtn" class="login-btn" style="width:100%;">Upload Directory Sheet</button>
                    </div>
                `;
            }

            else if (view === 'pending') {
                const res = await fetch('/api/manager/pending', { headers: {'Authorization': `Bearer ${token}`} });
                const data = await res.json();
                let html = '<div class="card"><h2>Pending Celebration Tracking</h2>';
                if (data.length === 0) {
                    html += '<p style="color:var(--text-muted)">Everything caught up! No celebrations pending.</p>';
                } else {
                    html += '<p style="color:var(--text-muted); margin-bottom:1.5rem;">Check off members whose celebrations have successfully concluded:</p>';
                    data.forEach(p => {
                        html += `<label style="display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:16px;">
                                    <input type="checkbox" class="pending-check" value="${p.id}" style="width:auto; margin:0;">
                                    <strong>${p.Name}</strong> (${p.Batch})
                                 </label>`;
                    });
                    html += '<button onclick="markCelebrated()" class="login-btn" style="width:100%; margin-top:1.5rem;">Commit Updates</button>';
                }
                content.innerHTML = html + '</div>';
            }

            else if (view === 'messages') {
                const res = await fetch('/api/manager/messages', { headers: {'Authorization': `Bearer ${token}`} });
                const data = await res.json();
                let html = '<h2>Inbox Notes from Team Members</h2>';
                if (data.length === 0) html += '<div class="card"><p style="color:var(--text-muted)">No new messages received.</p></div>';
                data.forEach(m => {
                    html += `<div class="card">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                    <span style="color:var(--primary); font-weight:700;">From: @${m.sender}</span>
                                    <div style="display:flex; align-items:center; gap:15px;">
                                        <small style="color:var(--text-muted);">${new Date(m.created_at).toLocaleDateString()}</small>
                                        <button onclick="deleteMessage(${m.id})" style="padding: 6px 12px; font-size:13px; background:var(--accent); color:white; border:none; border-radius:8px; cursor:pointer;"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                                <h3>${m.topic}</h3>
                                <p style="margin-top:10px; line-height:1.5;">${m.description}</p>
                             </div>`;
                });
                content.innerHTML = html;
            }
        }

        // Functions
        function filterTable() {
            const filter = document.getElementById("searchBar").value.toUpperCase();
            const tr = document.getElementById("bdayTable").getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                const tdName = tr[i].getElementsByTagName("td")[0];
                const tdBatch = tr[i].getElementsByTagName("td")[1];
                if (tdName || tdBatch) {
                    const txt = (tdName.textContent || '') + " " + (tdBatch.textContent || '');
                    tr[i].style.display = txt.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }

        async function addManual() {
            const name = document.getElementById('bName').value;
            const batch = document.getElementById('bBatch').value;
            const dob = document.getElementById('bDob').value;
            if(!name || !dob) return alert("Name and Birthday fields are required.");

            await fetch('/api/manager/birthdays', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify({ name, batch, dob })
            });
            alert('Member entry successfully recorded!');
            loadView('all');
        }

        async function uploadCSV() {
            const fileInput = document.getElementById('csvFile');
            if (fileInput.files.length === 0) return alert("Please select a valid CSV sheet first.");

            const btn = document.getElementById('uploadBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Parsing & Updating Database...';
            btn.style.pointerEvents = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/api/manager/birthdays', {
                method: 'POST',
                headers: {'Authorization': `Bearer ${token}`},
                body: formData
            });
            const data = await res.json();

            btn.innerHTML = 'Upload Directory Sheet';
            btn.style.pointerEvents = 'auto';

            if (res.ok) {
                alert('Database updated smoothly from sheet!');
                loadView('all');
            } else {
                alert('Error processing file: ' + data.error);
            }
        }

        async function deleteBday(id) {
            if(!confirm("Are you sure you want to remove this profile entry permanently?")) return;
            await fetch('/api/manager/birthdays', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify({Sl_no: id})
            });
            loadView('all');
        }

        async function markCelebrated() {
            const checks = document.querySelectorAll('.pending-check:checked');
            const ids = Array.from(checks).map(c => c.value);
            if(ids.length === 0) return alert("Select at least one record to commit.");

            await fetch('/api/manager/pending', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify({celebrated_ids: ids})
            });
            alert('Celebration pipeline updated!');
            loadView('pending');
        }

        async function deleteMessage(id) {
            if(!confirm("Are you sure you want to delete this message?")) return;

            await fetch('/api/manager/messages', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify({msg_id: id})
            });

            // Reload the view instantly so the deleted message vanishes
            loadView('messages');
        }
    </script>
</body>
</html>
