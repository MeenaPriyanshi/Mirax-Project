<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - IITK Athletics</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <div class="center-wrapper">
        <div class="login-container">
            <div class="login-panel">
                <div class="login-header">
                    <h2>Reset Password</h2>
                    <p id="subtext">Enter your email to receive an OTP.</p>
                </div>

                <div id="step-1" class="login-form">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" placeholder="Registered Email Address">
                        </div>
                    </div>
                    <button onclick="sendOTP()" id="btn-1" class="login-btn" style="width:100%;">Send Recovery OTP</button>
                </div>

                <div id="step-2" class="login-form" style="display: none;">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-key input-icon"></i>
                            <input type="text" id="otp" placeholder="Enter 6-digit OTP">
                        </div>
                    </div>
                    <button onclick="verifyOTP()" id="btn-2" class="login-btn" style="width:100%;">Verify Code</button>
                </div>

                <div id="step-3" class="login-form" style="display: none;">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="new-password" placeholder="New Password">
                        </div>
                    </div>
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirm-password" placeholder="Confirm Password">
                        </div>
                    </div>
                    <button onclick="resetPassword()" id="btn-3" class="login-btn" style="width:100%;">Save New Password</button>
                </div>

                <div class="login-footer" style="margin-top: 1.5rem;">
                    <a href="/" class="footer-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userEmail = '';

        async function sendOTP() {
            userEmail = document.getElementById('email').value;
            if(!userEmail) return alert("Please enter an email");

            const btn = document.getElementById('btn-1');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.style.pointerEvents = 'none';

            const res = await fetch('/api/forgot-password/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail})
            });
            const data = await res.json();

            btn.innerHTML = 'Send Recovery OTP';
            btn.style.pointerEvents = 'auto';

            if(res.ok) {
                document.getElementById('step-1').style.display = 'none';
                document.getElementById('step-2').style.display = 'flex';
                document.getElementById('subtext').innerText = 'Enter the 6-digit code sent to your email.';
            } else alert(data.message || data.error);
        }

        async function verifyOTP() {
            const otp = document.getElementById('otp').value;

            const btn = document.getElementById('btn-2');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            const res = await fetch('/api/forgot-password/verify-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail, otp: otp})
            });
            const data = await res.json();

            btn.innerHTML = 'Verify Code';

            if(res.ok) {
                document.getElementById('step-2').style.display = 'none';
                document.getElementById('step-3').style.display = 'flex';
                document.getElementById('subtext').innerText = 'Create your new password.';
            } else alert(data.message);
        }

        async function resetPassword() {
            const pwd = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;

            if(pwd !== confirm) return alert("Passwords do not match!");
            if(pwd.length < 6) return alert("Password must be at least 6 characters.");

            const btn = document.getElementById('btn-3');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            const res = await fetch('/api/forgot-password/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: userEmail, password: pwd})
            });
            const data = await res.json();

            if(res.ok) {
                alert("Password successfully reset! Please log in.");
                window.location.href = '/';
            } else {
                alert(data.message);
                btn.innerHTML = 'Save New Password';
            }
        }
    </script>
</body>
</html>
